[build]
  command = "npm run build"
  publish = "dist"

# Clave web de Firebase: publica por diseno (va en el bundle). Se excluye SOLO
# esta variable del escaneo de secretos; el resto de secretos sigue detectandose.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# Proxy transparente (status 200, NO 302) del handler de Firebase Auth: permite
# usar authDomain = getfluentmind.com. Debe ir ANTES del fallback SPA: Netlify
# aplica la primera regla que coincide.
[[redirects]]
  from = "/__/auth/*"
  to = "https://fluentmind-43693.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
